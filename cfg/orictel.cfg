# OricTel - Configuration linker cc65 pour Oric Atmos
#
# Mode BASIC ($00) : le TAP contient un stub BASIC "CALL entry"
# qui est execute par RUN. Compatible fast-load de Phosphoric.
# Pas de GRAB HIRES pour v0.1 (mode texte uniquement).

SYMBOLS {
    __TAPEHDR__:   type = import;
    __BASHDR__:    type = import;
    __PROGFLAG__:  type = weak, value = $00;   # BASIC (stub CALL)
    __AUTORUN__:   type = weak, value = $C7;   # Auto-run au chargement
    __STACKSIZE__: type = weak, value = $0400;  # 1 Ko de pile C ($9C00-$9FFF), releve < 32 octets en session
    __CHARSET__:   type = weak, value = $9800;  # jeu de caracteres standard des 3 lignes texte (barre de statut)
    __GRAB__:      type = weak, value = 0;      # Pas de HIRES grab pour v0.1
    __RAMEND__:    type = weak, value = $A000;   # Fin RAM utilisateur (jusqu'au framebuffer HIRES $A000)
}
MEMORY {
    ZP:      file = "", define = yes, start = $00E2,            size = $001A;
    TAPEHDR: file = %O, type   = ro,  start = $0000,            size = $001F;
    BASHEAD: file = %O, define = yes, start = $0501,            size = $000D;
    MAIN:    file = %O, define = yes, start = __BASHEAD_LAST__, size = __RAMEND__ - __MAIN_START__;
    # BSS s'arrete AVANT le jeu de caracteres $9800-$9BFF (barre de statut) ;
    # la pile C occupe $9C00-$9FFF, la ou vit le jeu alternatif (jamais selectionne).
    BSS:     file = "",               start = __ONCE_RUN__,     size = __CHARSET__ - __ONCE_RUN__;
    # Tampons NON initialises (jamais mis a zero par le crt0 ; la bascule
    # HIRES de la ROM les remplit de $40 : a n'utiliser qu'apres display_init).
    # $9800-$98FF : glyphes des codes $00-$1F du jeu texte, jamais affiches
    # (ces codes sont des attributs en mode texte).
    LOBSS:   file = "",               start = $9800,            size = $0100;
    # $9C00-$9D0F : bas de la zone de pile C (1 Ko nominal) ; la pile reste
    # au-dessus de $9E00, verifie par test_menus sur $9D10-$9DFF.
    HIBSS:   file = "",               start = $9C00,            size = $0110;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    TAPEHDR:  load = TAPEHDR, type = ro;
    BASHDR:   load = BASHEAD, type = ro,  optional = yes;
    STARTUP:  load = MAIN,    type = ro;
    LOWCODE:  load = MAIN,    type = ro,  optional = yes;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro;
    DATA:     load = MAIN,    type = rw;
    INIT:     load = MAIN,    type = rw;
    ONCE:     load = MAIN,    type = ro,  define   = yes;
    BASTAIL:  load = MAIN,    type = ro,  optional = yes;
    BSS:      load = BSS,     type = bss, define   = yes;
    LOBSS:    load = LOBSS,   type = bss, optional = yes;
    HIBSS:    load = HIBSS,   type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
